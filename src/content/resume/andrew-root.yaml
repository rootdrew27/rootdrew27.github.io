projects:
  - name: Tether
    href: https://github.com/rootdrew27/tether
    description: >-
      An agent-first relationship layer over Git, published to PyPI as
      tether-it. A tether links two artifacts, such as a function and the
      documentation describing it, fingerprinting both ends with git blob OIDs
      so that drift is flagged at the symbol or section level rather than across
      the whole file. Paths that break are run through git's rename detector to
      surface a rename candidate. Ships a Claude Code integration: session hooks
      that report drift, permission rules, and an onboarding skill that seeds
      the initial graph.
    tech:
      - Python
      - Git
      - PyPI
      - GitHub Actions
      - Claude Code
  - name: Voice-Assistant Task Manager
    href: https://github.com/rootdrew27/task-manager-v2
    description: >-
      A full-stack, real-time voice agent that lets users create, edit, and manage
      tasks entirely by speech, with no traditional UI controls. Audio streams to a
      Python agent that transcribes it, resolves intent with an LLM, executes the
      matching database operations, and pushes updates to the frontend live.
    tech:
      - Python
      - LLMs
      - LiveKit
      - Speech-to-Text
      - Next.js
      - TypeScript

